<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title} + ' - Details'">Movie Details</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1 th:text="${movie.title}">Movie Title</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/login}">Login</a>
    </nav>
    <hr/>
</header>

<main>
    <section>
        <h2>Movie Information</h2>
        <p><strong>Director:</strong> <span th:text="${movie.director}">Director</span></p>
        <p><strong>Genre:</strong> <span th:text="${movie.genre}">Genre</span></p>
        <p><strong>Release Year:</strong> <span th:text="${movie.releaseYear}">Year</span></p>
    </section>

    <section>
        <h2>Reviews</h2>
        <div th:if="${#lists.isEmpty(reviews)}">
            <p>No reviews yet. Be the first to add one!</p>
        </div>
        <ul th:if="${!#lists.isEmpty(reviews)}">
            <li th:each="review : ${reviews}">
                <strong th:text="${review.reviewerName}">Reviewer</strong>
                <span th:text="' - ' + ${review.rating} + '/5'">Rating</span>
                <p th:text="${review.comment}">Comment</p>
            </li>
        </ul>
    </section>

    <section>
        <h2>Add a Review</h2>
        <p>You must be logged in as a user or admin to submit a review.</p>
        <form th:action="@{'/movies/' + ${movie.id} + '/reviews'}"
              th:object="${reviewForm}"
              method="post">
            <div>
                <label for="reviewerName">Name</label>
                <input id="reviewerName" type="text" th:field="*{reviewerName}"/>
            </div>
            <div>
                <label for="rating">Rating (1-5)</label>
                <input id="rating" type="number" min="1" max="5" th:field="*{rating}"/>
            </div>
            <div>
                <label for="comment">Comment</label>
                <textarea id="comment" th:field="*{comment}"></textarea>
            </div>
            <button type="submit">Submit Review</button>
        </form>
    </section>
</main>

</body>
</html>
